name: Beacon
options:
  bundleIdPrefix: com.cluas
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

# DEVELOPMENT_TEAM is supplied by Signing.xcconfig (kept out of git, see
# that file) so on-device signing survives `xcodegen generate`. It is NOT
# set in `settings` here, because project build settings would override the
# xcconfig value.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic

packages:
  SwiftTerm:
    # Forked from migueldeicaza/SwiftTerm at v1.13.0 (see the fork's commit
    # messages): (1)+(2) two OSC-8 hyperlink underline-overshoot fixes in
    # oscHyperlink's close handler, (3) a new public API (viewportLineText /
    # tagPlainTextLink) letting Beacon linkify plain http(s) URLs it detects
    # itself, reusing the same cell.hasPayload path a real OSC-8 hyperlink
    # uses — SwiftTerm's own built-in implicit-link regex is too permissive
    # (matches bare file paths) to turn on globally, (4) singleTap checks for
    # a link hit BEFORE treating a not-yet-focused tap as "just focus me" —
    # otherwise tapping a link while the keyboard was dismissed silently ate
    # the first tap and needed a second one, (5) setMarkedText/unmarkText now
    # paint an underlined overlay at the cursor for IME composition (Pinyin
    # etc.) — previously tracked internally but never rendered anywhere,
    # (6) a caret within that overlay advances to the actual insertion
    # point as composition grows. Revert to the upstream URL if/when these
    # land there and a release picks them up.
    url: https://github.com/Cluas/SwiftTerm.git
    revision: a8f1a2875468f98b73528eed9815ad4cd33cf1cf
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"

targets:
  Beacon:
    type: application
    platform: iOS
    sources:
      - path: Beacon
    entitlements:
      path: Beacon/App/Beacon.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cluas.beacon
    settings:
      base:
        INFOPLIST_FILE: Beacon/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.beacon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - target: BeaconIsland
        embed: true
    info:
      path: Beacon/App/Info.plist
      properties:
        CFBundleName: Beacon
        CFBundleDisplayName: Beacon
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - MapleMono-Regular.ttf
          - FiraCode-Regular.ttf
          - SourceCodePro-Regular.ttf
          - IBMPlexMono-Regular.ttf
          - Hack-Regular.ttf
          - AnonymousPro-Regular.ttf
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIcon-BeaconClassic:
              CFBundleIconFiles:
                - AppIcon-BeaconClassic60x60
              UIPrerenderedIcon: false
            AppIcon-TerminalGreen:
              CFBundleIconFiles:
                - AppIcon-TerminalGreen60x60
              UIPrerenderedIcon: false
            AppIcon-AmberConsole:
              CFBundleIconFiles:
                - AppIcon-AmberConsole60x60
              UIPrerenderedIcon: false
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Use Face ID to unlock SSH keys"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - beacon
            CFBundleURLName: com.cluas.beacon

  BeaconIsland:
    type: app-extension
    platform: iOS
    sources:
      - path: BeaconIsland
      - path: Beacon/Island/AgentActivityAttributes.swift
      - path: Beacon/Island/AgentControl.swift
      - path: Beacon/Island/AgentWidgetState.swift
    entitlements:
      path: BeaconIsland/BeaconIsland.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cluas.beacon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.beacon.island
    info:
      path: BeaconIsland/Info.plist
      properties:
        CFBundleDisplayName: Beacon Island
        # Keep the extension's version in lockstep with the app — a mismatch is
        # an App Store rejection. Driven by the shared MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION in settings.base, same as the app target.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  BeaconUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BeaconUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.beacon.uitests
        TEST_TARGET_NAME: Beacon
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Beacon

  BeaconTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeaconTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.beacon.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Beacon

schemes:
  Beacon:
    build:
      targets:
        Beacon: all
        BeaconTests: [test]
        BeaconUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeaconTests
        - BeaconUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
