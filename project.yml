name: Moshi
options:
  bundleIdPrefix: com.cluas
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

# DEVELOPMENT_TEAM is supplied by Signing.xcconfig (kept out of git, see
# that file) so on-device signing survives `xcodegen generate`. It is NOT
# set in `settings` here, because project build settings would override the
# xcconfig value.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic

packages:
  SwiftTerm:
    # Forked from migueldeicaza/SwiftTerm at v1.13.0 to fix two OSC-8 hyperlink
    # underline-overshoot bugs in oscHyperlink's close handler (see the fork's
    # commit messages): (1) tagged one cell past the link text when it was the
    # last thing printed on its line, (2) tagged the ENTIRE rest of the line
    # once any scrollback had accumulated (an absolute-vs-viewport-relative row
    # comparison bug — essentially always hit in a real session). Revert to the
    # upstream URL if/when these land there and a release picks them up.
    url: https://github.com/Cluas/SwiftTerm.git
    revision: 0fe3cfb9816b2d9da93ab672e4bd886ca8b44ab9
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"

targets:
  Moshi:
    type: application
    platform: iOS
    sources:
      - path: Moshi
    entitlements:
      path: Moshi/App/Moshi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cluas.moshi
    settings:
      base:
        INFOPLIST_FILE: Moshi/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.moshi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - target: MoshiIsland
        embed: true
    info:
      path: Moshi/App/Info.plist
      properties:
        CFBundleName: Moshi
        CFBundleDisplayName: Moshi
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - MapleMono-Regular.ttf
          - FiraCode-Regular.ttf
          - SourceCodePro-Regular.ttf
          - IBMPlexMono-Regular.ttf
          - Hack-Regular.ttf
          - AnonymousPro-Regular.ttf
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
            CFBundleIconName: AppIcon
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Use Face ID to unlock SSH keys"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - moshi
            CFBundleURLName: com.cluas.moshi

  MoshiIsland:
    type: app-extension
    platform: iOS
    sources:
      - path: MoshiIsland
      - path: Moshi/Island/AgentActivityAttributes.swift
      - path: Moshi/Island/AgentControl.swift
      - path: Moshi/Island/AgentWidgetState.swift
    entitlements:
      path: MoshiIsland/MoshiIsland.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cluas.moshi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.moshi.island
    info:
      path: MoshiIsland/Info.plist
      properties:
        CFBundleDisplayName: Moshi Island
        # Keep the extension's version in lockstep with the app — a mismatch is
        # an App Store rejection. Driven by the shared MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION in settings.base, same as the app target.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MoshiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoshiUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.moshi.uitests
        TEST_TARGET_NAME: Moshi
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Moshi

  MoshiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoshiTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.moshi.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Moshi

schemes:
  Moshi:
    build:
      targets:
        Moshi: all
        MoshiTests: [test]
        MoshiUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Moshi/Moshi.storekit
    test:
      config: Debug
      storeKitConfiguration: Moshi/Moshi.storekit
      targets:
        - MoshiTests
        - MoshiUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
