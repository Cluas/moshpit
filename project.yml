name: Moshpit
options:
  bundleIdPrefix: com.cluas
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

# DEVELOPMENT_TEAM is supplied by Signing.xcconfig (kept out of git, see
# that file) so on-device signing survives `xcodegen generate`. It is NOT
# set in `settings` here, because project build settings would override the
# xcconfig value.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    # Only the floor for local builds. A release overrides it from the command
    # line (scripts/release-archive.sh) — App Store Connect requires a build
    # number that is unique and monotonically increasing within a version, and
    # bumping it here by hand is exactly the step that gets forgotten.
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      # Pinned for Debug only — it MUST NOT sit in `base`. An App Store archive
      # has to be signed "Apple Distribution", and an explicit identity in base
      # beats automatic signing's own per-action choice: the archive would then
      # be built with a development certificate, which App Store Connect
      # rejects on upload. Release deliberately sets nothing, so automatic
      # signing keeps picking Development for a plain `build` (including the
      # free-Personal-Team path in docs/install-free-account.md, which builds
      # Debug anyway) and Distribution when archiving.
      CODE_SIGN_IDENTITY: "Apple Development"

packages:
  SwiftTerm:
    # Forked from migueldeicaza/SwiftTerm at v1.13.0 (see the fork's commit
    # messages): (1)+(2) two OSC-8 hyperlink underline-overshoot fixes in
    # oscHyperlink's close handler, (3) a new public API (viewportLineText /
    # tagPlainTextLink) letting Moshpit linkify plain http(s) URLs it detects
    # itself, reusing the same cell.hasPayload path a real OSC-8 hyperlink
    # uses — SwiftTerm's own built-in implicit-link regex is too permissive
    # (matches bare file paths) to turn on globally, (4) singleTap checks for
    # a link hit BEFORE treating a not-yet-focused tap as "just focus me" —
    # otherwise tapping a link while the keyboard was dismissed silently ate
    # the first tap and needed a second one, (5) setMarkedText/unmarkText now
    # paint an underlined overlay at the cursor for IME composition (Pinyin
    # etc.) — previously tracked internally but never rendered anywhere,
    # (6) that overlay moves the terminal's own real cursor (caretView) to
    # the end of the composing text as it grows, rather than drawing a
    # second separate caret or tracking a mid-composition insertion offset
    # (which jittered back to the front — phonetic IMEs replace the whole
    # marked string per keystroke and candidate paging can report a stale
    # selectedRange), (7) deleteBackward() during active composition
    # removes one character from the end of the marked text and sends
    # nothing to the terminal, instead of nuking the whole composition in
    # one shot with real (wrong) backspace keypresses — fixes hold-to-repeat
    # delete under the Pinyin keyboard, (8) a new public `isRowWrapped(_:)`
    # on Terminal exposing the emulator's own soft-wrap bit, so Moshpit can
    # join a URL that wrapped across rows exactly instead of guessing from
    # row text width (which broke, silently truncating the opened link,
    # whenever a CJK/emoji character earlier on the row threw off a
    # character-count-vs-column-count comparison), and (9) composition-end
    # no longer snaps the caret to updateCursorPosition() — the terminal
    # buffer's cursor hasn't moved yet at that instant (the committed text
    # is only just sent, not yet echoed back), so snapping to it yanked the
    # caret backwards to the pre-composition position right as you finished
    # typing a word, (10) UIKeyInput.hasText now always reports true — UIKit
    # gates the delete key's hold-to-repeat on it, and answering from
    # SwiftTerm's shadow input buffer (emptied on every Return, and empty for
    # anything the REMOTE put on screen) killed hold-to-delete for exactly
    # the text you most want to clear: a reattached session's half-written
    # prompt — and (11) updateCursorPosition() defers to the composition
    # overlay while an IME composition is on screen, so a pane that keeps
    # repainting (agent status line, resync, reflow) stops yanking the caret
    # from the end of the Pinyin back to its front mid-word — (9) fixed that
    # coming from the IME, this fixes it coming from output. Revert to the
    # upstream URL if/when these land there and a release picks them up.
    url: https://github.com/Cluas/SwiftTerm.git
    revision: 866078a3831fecc8bccb170a9855bc9b551745c4
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"

targets:
  Moshpit:
    type: application
    platform: iOS
    sources:
      - path: Moshpit
    entitlements:
      path: Moshpit/App/Moshpit.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cluas.moshpit
    settings:
      base:
        INFOPLIST_FILE: Moshpit/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.moshpit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # iPhone + iPad, CONFIRMED as a shipping decision (2026-08-08), not
        # inherited from XcodeGen's "1,2" preset. Two obligations follow and
        # neither is optional: App Store Connect demands 13" iPad screenshots
        # for every release, and reviewers will open the app on a display the
        # layout has to actually work on. It is also one-way — an app that
        # shipped with iPad support cannot drop it later without abandoning
        # the customers who bought it on one.
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Both of these exist to beat XcodeGen's own setting preset for iOS
        # application targets, which injects a legacy
        # `CODE_SIGN_IDENTITY = "iPhone Developer"` into EVERY config of this
        # target. Target settings win over the project-level ones above, so
        # fixing this at the project level alone silently achieves nothing and
        # a Release archive still goes out development-signed — which App Store
        # Connect rejects. Verify after `xcodegen generate` with:
        #   grep -c 'iPhone Developer' Moshpit.xcodeproj/project.pbxproj   # 0
        #
        # Note this means a local Release build (the scheme's Profile action)
        # now wants a distribution certificate, so a free Personal Team has to
        # stay on Debug — which is what docs/install-free-account.md and
        # scripts/build-ipa.sh already do.
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - target: MoshpitIsland
        embed: true
    info:
      path: Moshpit/App/Info.plist
      properties:
        CFBundleName: Moshpit
        CFBundleDisplayName: Moshpit
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - MapleMono-Regular.ttf
          - FiraCode-Regular.ttf
          - SourceCodePro-Regular.ttf
          - IBMPlexMono-Regular.ttf
          - Hack-Regular.ttf
          - AnonymousPro-Regular.ttf
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
            CFBundleIconName: AppIcon
          # Alternate icons must be bundled and declared here — iOS can only
          # switch to names it finds at launch, and nothing can generate an
          # icon at runtime. That is why the icon is its own independent
          # choice rather than something derived from the (customizable)
          # accent color. Generated by scripts/generate-app-icons.swift.
          CFBundleAlternateIcons:
            AppIcon-Ringdown:
              CFBundleIconFiles:
                - AppIcon-Ringdown60x60
              UIPrerenderedIcon: false
            AppIcon-Wq:
              CFBundleIconFiles:
                - AppIcon-Wq60x60
              UIPrerenderedIcon: false
            AppIcon-Prefix:
              CFBundleIconFiles:
                - AppIcon-Prefix60x60
              UIPrerenderedIcon: false
            AppIcon-Localhost:
              CFBundleIconFiles:
                - AppIcon-Localhost60x60
              UIPrerenderedIcon: false
            AppIcon-NoCarrier:
              CFBundleIconFiles:
                - AppIcon-NoCarrier60x60
              UIPrerenderedIcon: false
            AppIcon-Cursor:
              CFBundleIconFiles:
                - AppIcon-Cursor60x60
              UIPrerenderedIcon: false
            AppIcon-Hail:
              CFBundleIconFiles:
                - AppIcon-Hail60x60
              UIPrerenderedIcon: false
        NSSupportsLiveActivities: true
        # Answers App Store Connect's export-compliance question in the binary
        # instead of leaving every upload parked on "Missing Compliance".
        #
        # Settled as `true`: Moshpit ships its own strong confidentiality
        # crypto — Citadel/swift-crypto for SSH, plus the OCB3/AES + ChaCha20
        # code under Services/Mosh — so none of the narrow cases Apple treats
        # as exempt apply (OS-provided crypto only, authentication-only, DRM,
        # <=56-bit keys, medical). The looser reading available to a public MIT
        # codebase (publicly-available source, EAR 740.13(e)/742.15(b)) was
        # considered and deliberately not taken: `true` is the conservative
        # answer and costs nothing at build time.
        #
        # What that implies at release time, which no build setting can do for
        # you: the first submission of a version asks the follow-up questions in
        # App Store Connect (the answer is standard algorithms, nothing
        # proprietary), and the account holder carries the mass-market
        # self-classification duty for ECCN 5D992.c — the annual report to
        # BIS/NSA. If an ERN or CCATS code ever comes back, declare it beside
        # this key as ITSEncryptionExportComplianceCode.
        ITSAppUsesNonExemptEncryption: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Use Face ID to unlock SSH keys"
        # Voice input (Settings → VOICE INPUT, mic key on the terminal bar).
        # BOTH keys are required or App Review rejects the binary: the mic key
        # for the recording session, the speech key because the iOS 18–25 path
        # goes through SFSpeechRecognizer (which gates on that permission).
        # The "on-device / never uploaded" wording is a real, load-bearing
        # promise: DictationEngineFactory refuses the server recognition path
        # outright (on-device only, all OS versions), so keep code and copy in
        # lockstep if either ever changes.
        NSMicrophoneUsageDescription: "Voice input uses the microphone so you can dictate commands and prompts into your terminal. Audio is transcribed by Apple's speech models entirely on this device and is never uploaded anywhere."
        NSSpeechRecognitionUsageDescription: "Dictation runs Apple's on-device speech recognition. Your voice and transcripts never leave this device — Moshpit does not use server-based recognition."
        # MUST live here, not just in Info.plist: XcodeGen regenerates that file
        # from this block, so a key added to the plist by hand silently vanishes
        # at the next `xcodegen generate`. Without this key iOS drops UDP to LAN
        # addresses on the floor, which presents as "SSH connects but mosh
        # black-screens" against a 192.168.x.x host.
        NSLocalNetworkUsageDescription: "Moshpit connects to servers on your local network over SSH and mosh (UDP). Without this permission, connections to LAN hosts (e.g. 192.168.x.x) will fail."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - moshpit
            CFBundleURLName: com.cluas.moshpit

  MoshpitIsland:
    type: app-extension
    platform: iOS
    sources:
      - path: MoshpitIsland
      - path: Moshpit/Island/AgentActivityAttributes.swift
      - path: Moshpit/Island/AgentControl.swift
      - path: Moshpit/Island/AgentPalette.swift
      - path: Moshpit/Island/AgentWidgetState.swift
    entitlements:
      path: MoshpitIsland/MoshpitIsland.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cluas.moshpit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.moshpit.island
    info:
      path: MoshpitIsland/Info.plist
      properties:
        CFBundleDisplayName: Moshpit Island
        # Keep the extension's version in lockstep with the app — a mismatch is
        # an App Store rejection. Driven by the shared MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION in settings.base, same as the app target.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MoshpitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoshpitUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.moshpit.uitests
        TEST_TARGET_NAME: Moshpit
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Moshpit

  MoshpitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoshpitTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.moshpit.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Moshpit

schemes:
  Moshpit:
    build:
      targets:
        Moshpit: all
        MoshpitTests: [test]
        MoshpitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoshpitTests
        - MoshpitUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
