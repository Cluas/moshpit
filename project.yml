name: Vosh
options:
  bundleIdPrefix: com.cluas
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: "1.2.0"
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"

targets:
  Vosh:
    type: application
    platform: iOS
    sources:
      - path: Vosh
    entitlements:
      path: Vosh/App/Vosh.entitlements
      properties: {}
    settings:
      base:
        INFOPLIST_FILE: Vosh/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.vosh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - target: VoshIsland
        embed: true
    info:
      path: Vosh/App/Info.plist
      properties:
        CFBundleName: Moshi
        CFBundleDisplayName: Moshi
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon60x60
            CFBundleIconName: AppIcon
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Use Face ID to unlock SSH keys"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - vosh
            CFBundleURLName: com.cluas.vosh

  VoshIsland:
    type: app-extension
    platform: iOS
    sources:
      - path: VoshIsland
      - path: Vosh/Island/AgentActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.vosh.island
    info:
      path: VoshIsland/Info.plist
      properties:
        CFBundleDisplayName: Moshi Island
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  VoshUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VoshUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.vosh.uitests
        TEST_TARGET_NAME: Vosh
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Vosh

  VoshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoshTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.vosh.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Vosh

schemes:
  Vosh:
    build:
      targets:
        Vosh: all
        VoshTests: [test]
        VoshUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Vosh/Vosh.storekit
    test:
      config: Debug
      storeKitConfiguration: Vosh/Vosh.storekit
      targets:
        - VoshTests
        - VoshUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
