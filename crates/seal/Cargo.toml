[package]
name = "moshpit-seal"
description = "Moshpit's push envelope (format v1: AES-256-CBC + HMAC-SHA256, sealed on the dev host, opened on the phone), the pairing and send-token model, and what a notification service does with an opened push"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# RustCrypto (MIT OR Apache-2.0). aes 0.9 is the version crates/mosh links.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# The pairing secret and every IV come from the system CSPRNG.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A card cuts the detail by user-perceived characters, as Swift's String does.
unicode-segmentation = "1.13"
# The finishes record's cross-process lock (flock).
libc = "0.2"
