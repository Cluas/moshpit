[package]
name = "moshpit-spike-android"
description = "Spike gate G3: the Android app's libnsh.so (an NSH Rust root with the Termux terminal view as a native component), the JNI end of the byte channel, and an echo and burst core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Installed in the APK as lib/<abi>/libnsh.so (spike/android/build.sh): named
# after the crate so it never takes the place of nsh-platform-android's own
# cdylib, which Cargo also names libnsh.so.
crate-type = ["cdylib"]

# NSH only on Android: off it the library is the pure parts (the echo line
# discipline, the burst generator) and `cargo test --workspace` on the Mac
# stays light.
[target.'cfg(target_os = "android")'.dependencies]
moshpit-stream = { path = "../stream" }
nsh-core.workspace = true
nsh-platform-android.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
