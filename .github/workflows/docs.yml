name: Docs

# README translations that no longer follow README.md show up as warnings
# (scripts/readme-translations.py). Never a failure: a translation can wait
# for someone who writes that language.

on:
  push:
    paths: ["README*.md", "scripts/readme-translations.py"]
  pull_request:
    paths: ["README*.md", "scripts/readme-translations.py"]

permissions:
  contents: read

jobs:
  readme:
    name: README translations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Translations behind README.md
        continue-on-error: true
        run: python3 -I scripts/readme-translations.py --github
