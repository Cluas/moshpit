name: Screenshots

# The App Store and README screenshots: a Debug simulator build of the app,
# a host staged on the runner itself (sshd on loopback, tmux on a private
# socket, a throwaway key), the app seeded to each screen on the iPhone 6.9"
# and iPad 13" simulators, and the PNGs kept as the run's artifact.
# scripts/shots/ci-capture.sh does the staging and the shots; the lock
# screen and the Dynamic Island come from scripts/shots/external/, taken on
# a phone. Each device shoots on a runner of its own, in parallel (one
# simulator per machine: the shots stall less, and a failed device can be
# rerun alone). A run takes about an hour, so it runs nightly, on each
# version tag and by hand, never on a push.
#
# A complete set from main or a version tag (both devices, every slot,
# every locale, the store's sizes: scripts/shots/pages.py) is published to
# GitHub Pages at
# /shots/<iphone|ipad>/<locale>/<nn>-<shot>.png, where the READMEs link.
# Anything less publishes nothing, and the last good set stays up.
on:
  schedule:
    - cron: "23 18 * * *" # 02:23 in Shanghai, 18:23 UTC: off-peak for the runners
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      devices:
        description: Which simulators
        type: choice
        options: [both, iphone, ipad]
        default: both
      locales:
        description: Locales, space-separated, or "all" (every locale the app ships, LOCALES below)
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shots:
    name: Screenshots (${{ matrix.device }}, ${{ inputs.locales || 'all' }})
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # The devices asked for (a scheduled or tag run asks for both).
        device: ${{ fromJSON(inputs.devices == 'iphone' && '["iphone"]' || inputs.devices == 'ipad' && '["ipad"]' || '["iphone","ipad"]') }}

    env:
      SPM_CACHE_DIR: ${{ github.workspace }}/.spm-cache
      # Every locale the app ships, shot for every simulator shot. Trim here.
      LOCALES_ALL: en-US zh-Hans zh-Hant ja de-DE es-ES fr-FR ko pt-BR
      DEVICE: ${{ matrix.device }}
      # A scheduled or tag run has no inputs: every locale.
      LOCALES: ${{ inputs.locales || 'all' }}
      # The lock screen and the Dynamic Island, taken on a phone.
      SHOTS_EXTERNAL: ${{ github.workspace }}/scripts/shots/external

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same pick as CI's: the newest Xcode 27, a simulator to build for.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone|iPad' || true
          iphones=$(xcrun simctl list devices available |
            sed -nE 's/^ +(iPhone.*[^ ]) \([0-9A-F-]{36}\).*/\1/p')
          SIMULATOR="iPhone 18 Pro"
          grep -qxF "$SIMULATOR" <<< "$iphones" || SIMULATOR=$(tail -1 <<< "$iphones")
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"

      - name: Install xcodegen and tmux
        run: brew install xcodegen tmux

      - name: Install the Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-ios-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: ${{ env.SPM_CACHE_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('Moshpit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Debug: the DEBUG seeds the shots are made with. The same build for
      # either simulator (the app is universal); arm64 only. For testing too: the
      # shots a page has to be waited for are ShotsUITest's.
      - name: Build the app
        run: |
          xcodebuild build-for-testing \
            -project Moshpit.xcodeproj \
            -scheme Moshpit \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath "$SPM_CACHE_DIR" \
            CODE_SIGNING_ALLOWED=NO
          ls -d build/dd/Build/Products/Debug-iphonesimulator/Moshpit.app
          echo "SHOTS_XCTESTRUN=$(ls build/dd/Build/Products/*.xctestrun | head -1)" >> "$GITHUB_ENV"

      - name: The shots
        run: |
          [ "$LOCALES" = all ] && LOCALES="$LOCALES_ALL"
          case "$DEVICE" in iphone) out=shots/iphone-6.9 ;; ipad) out=shots/ipad-13 ;; esac
          # shellcheck disable=SC2086 # one locale per word
          scripts/shots/ci-capture.sh build/dd/Build/Products/Debug-iphonesimulator/Moshpit.app \
            "$out" "$DEVICE" $LOCALES

      - name: Keep the shots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shots-${{ github.run_number }}-${{ matrix.device }}
          path: shots
          if-no-files-found: warn

      # This device's whole set or nothing: every slot in every locale, at
      # the store's sizes. The publish job needs both devices' to pass.
      - name: Check the set
        run: python3 -I scripts/shots/pages.py check shots --device "$DEVICE"

  # After both devices passed their check, for the whole set only (a run by
  # hand for one device or some locales publishes nothing), from main or a
  # version tag.
  publish:
    name: Publish to GitHub Pages
    needs: shots
    if: >-
      (inputs.devices || 'both') == 'both' && (inputs.locales || 'all') == 'all' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}shots/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch both devices' shots
        uses: actions/download-artifact@v8
        with:
          pattern: shots-${{ github.run_number }}-*
          merge-multiple: true
          path: shots

      - name: Lay out the site
        run: python3 -I scripts/shots/pages.py site shots site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
