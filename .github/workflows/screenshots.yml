name: Screenshots

# The App Store and README screenshots: a Debug simulator build of the app,
# a host staged on the runner itself (sshd on loopback, tmux on a private
# socket, a throwaway key), the app seeded to each screen on the iPhone 6.9"
# and iPad 13" simulators, and the PNGs kept as artifacts.
# scripts/shots/ci-capture.sh does the staging and the shots; the lock
# screen and the Dynamic Island come from scripts/shots/external/, taken on
# a phone.
#
# The app is built once (`build`), and the shots are taken by a job per
# device and group of locales (`shoot`, scripts/shots/plan.py), side by side
# on the macOS runners a public repository gets at once. A job that failed
# is retried alone ("Re-run failed jobs"). A run by hand may ask for some
# devices, locales and slots only (`shots`: 01,04,08). It runs nightly, on
# each version tag and by hand, never on a push: the whole set takes most of
# an hour.
#
# From main or a version tag, the set is published to GitHub Pages at
# /shots/<iphone|ipad>/<locale>/<nn>-<shot>.png, where the READMEs link. A
# run that shot part of it is laid over the set that is live; either way
# the set that goes up must be whole (every slot of both devices in every
# locale, at the store's sizes), or nothing goes up and the last good set
# stays.
on:
  schedule:
    - cron: "23 18 * * *" # 02:23 in Shanghai, 18:23 UTC: off-peak for the runners
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      devices:
        description: Which simulators
        type: choice
        options: [both, iphone, ipad]
        default: both
      locales:
        description: Locales, separated by commas or spaces, or "all" (every locale with captions)
        type: string
        default: all
      shots:
        description: "The store's slots by number, like 01,04,08 (each device's order in scripts/shots/captions), or all"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICES: ${{ inputs.devices || 'both' }}
  LOCALES: ${{ inputs.locales || 'all' }}
  SHOTS: ${{ inputs.shots || 'all' }}

jobs:
  # The shoot jobs this run needs (a scheduled or tag run: every one).
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Plan the shoot jobs
        id: plan
        run: python3 -I scripts/shots/plan.py "$DEVICES" "$LOCALES" "$SHOTS" | tee -a "$GITHUB_OUTPUT"

  # Debug, for testing: the DEBUG seeds the shots are made with, the same
  # build for either simulator (the app is universal), arm64 only. Its
  # products go to every shoot job.
  build:
    name: Build
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      SPM_CACHE_DIR: ${{ github.workspace }}/.spm-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same pick as CI's: the newest Xcode 27, a simulator to build for.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version
          iphones=$(xcrun simctl list devices available |
            sed -nE 's/^ +(iPhone.*[^ ]) \([0-9A-F-]{36}\).*/\1/p')
          SIMULATOR="iPhone 18 Pro"
          grep -qxF "$SIMULATOR" <<< "$iphones" || SIMULATOR=$(tail -1 <<< "$iphones")
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install the Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-ios-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: ${{ env.SPM_CACHE_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('Moshpit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build the app
        run: |
          xcodebuild build-for-testing \
            -project Moshpit.xcodeproj \
            -scheme Moshpit \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath "$SPM_CACHE_DIR" \
            CODE_SIGNING_ALLOWED=NO
          ls -d build/dd/Build/Products/Debug-iphonesimulator/{Moshpit,MoshpitUITests-Runner}.app \
            build/dd/Build/Products/*.xctestrun

      # What test-without-building needs: the app (its unit tests inside),
      # the UI tests' runner, and the .xctestrun that names them relative
      # to the products folder.
      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.run_number }}
          path: |
            build/dd/Build/Products/*.xctestrun
            build/dd/Build/Products/Debug-iphonesimulator/Moshpit.app
            build/dd/Build/Products/Debug-iphonesimulator/MoshpitUITests-Runner.app
          retention-days: 3
          if-no-files-found: error

  shoot:
    name: Shots (${{ matrix.device }} ${{ matrix.group }}, ${{ matrix.locales }}, ${{ matrix.shots }})
    needs: [plan, build]
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      DEVICE: ${{ matrix.device }}
      GROUP_LOCALES: ${{ matrix.locales }}
      SHOTS_ONLY: ${{ matrix.shots }}
      # The lock screen and the Dynamic Island, taken on a phone.
      SHOTS_EXTERNAL: ${{ github.workspace }}/scripts/shots/external
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The build's Xcode, for its simulators and test runner.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version

      - name: Install tmux
        run: brew install tmux

      - name: Fetch the build
        uses: actions/download-artifact@v8
        with:
          name: build-${{ github.run_number }}
          path: build/dd/Build/Products

      - name: The shots
        run: |
          SHOTS_XCTESTRUN=$(find build/dd/Build/Products -maxdepth 1 -name '*.xctestrun' | head -1)
          export SHOTS_XCTESTRUN
          case "$DEVICE" in iphone) out=shots/iphone-6.9 ;; ipad) out=shots/ipad-13 ;; esac
          # shellcheck disable=SC2086 # one locale per word
          scripts/shots/ci-capture.sh build/dd/Build/Products/Debug-iphonesimulator/Moshpit.app \
            "$out" "$DEVICE" $GROUP_LOCALES

      - name: Keep the shots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shots-${{ github.run_number }}-${{ matrix.device }}-${{ matrix.group }}
          path: shots
          if-no-files-found: warn

      # This job's part of the set, whole: its device, locales and slots,
      # at the store's sizes.
      - name: Check the set
        run: |
          python3 -I scripts/shots/pages.py check shots --device "$DEVICE" \
            --locales "$GROUP_LOCALES" --slots "$SHOTS_ONLY"

  # After every shoot job passed its check, from main or a version tag: this
  # run's shots, laid over the live set when the run shot only part of it,
  # checked whole, and deployed.
  publish:
    name: Publish to GitHub Pages
    needs: [plan, shoot]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}shots/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: The site's address
        id: pages
        uses: actions/configure-pages@v6

      - name: Fetch the live set
        if: needs.plan.outputs.full != 'true'
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: python3 -I scripts/shots/pages.py fetch "$BASE" shots

      - name: Fetch this run's shots
        uses: actions/download-artifact@v8
        with:
          pattern: shots-${{ github.run_number }}-*
          merge-multiple: true
          path: run

      # This run's store images in place of the live ones.
      - name: Lay this run's shots over
        run: |
          mkdir -p shots
          cp -R run/. shots/
          find run -path '*/store/*' -name '*.png' | sed 's|^run/||' | sort | sed 's/^/  from this run: /'

      - name: Lay out the site
        run: python3 -I scripts/shots/pages.py site shots site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
