name: CI

# Moshpit is an iOS 18 app whose Xcode project is generated from project.yml
# by xcodegen (project.yml is the source of truth; Moshpit.xcodeproj is a
# generated artifact), so CI regenerates it from scratch rather than trusting
# the checked-in copy. The app links one Rust static library (crates/ffi),
# which its "Build Rust" phase builds with cargo; the Rust core's own tests
# run on Linux, and the Android app's Play bundle is built there with Gradle
# (the development Mac can't run Gradle). Runs on every push to main and on
# pull requests; the manual trigger stays for re-running a flaky simulator boot.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fast-follow push doesn't pay for
# a stale build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rust-toolchain.toml pins the toolchain; this installs it (with
      # rustfmt and clippy) before anything asks for it.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # The workspace's crates that only build for Android or iOS (the
      # Android app's Rust half, the UI's iOS host) compile to their
      # platform-free parts here.
      # The workspace's own crates: not `--all`, which takes in the vendored
      # wezterm (a path dependency, upstream's formatting) too. Reported, not
      # yet enforced: the tree isn't formatted throughout; one `cargo fmt`
      # commit on nsh, once the open branches are merged, makes it, and this
      # step loses `continue-on-error` with it.
      - name: Format
        continue-on-error: true
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The Android app (android/, crates/android): its Java unit tests and the
  # release App Bundle the Play Store takes, built by Gradle with the Rust
  # library from android/rust.sh (cargo profile `app`). The build itself is
  # android/ci.sh, the script the development Mac runs in a Linux container
  # (android/docker.sh; no JDK 17+ starts on macOS 27): the SDK parts, the
  # pinned Rust toolchain and the Android target, then Gradle. The upload key
  # comes from the repository's secrets when they are set; without them the
  # bundle is unsigned.
  android:
    name: Android (unit tests, release bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-

      # Gradle on PATH (android/ci.sh fetches the same version where there
      # is none) and its caches.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOSHPIT_UPLOAD_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "MOSHPIT_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Unit tests and release bundle (android/ci.sh)
        env:
          MOSHPIT_UPLOAD_STORE_PASSWORD: ${{ secrets.MOSHPIT_UPLOAD_STORE_PASSWORD }}
          MOSHPIT_UPLOAD_KEY_ALIAS: ${{ secrets.MOSHPIT_UPLOAD_KEY_ALIAS }}
          MOSHPIT_UPLOAD_KEY_PASSWORD: ${{ secrets.MOSHPIT_UPLOAD_KEY_PASSWORD }}
          CARGO_BUILD_JOBS: "4"
        run: android/ci.sh

      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: moshpit-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/rust/release/symbols

  # GitHub's Xcode 27 image (macOS 27, arm64): the app ships built with
  # Xcode 27, and macos-26 carries Xcode 26.0 to 26.6 only, whose Swift 6.2
  # refuses code Xcode 27 builds.
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: xcode-27
    timeout-minutes: 90

    env:
      # Local SPM checkout dir so downloaded packages can be cached across runs
      # independently of DerivedData (which we intentionally do not cache).
      SPM_CACHE_DIR: ${{ github.workspace }}/.spm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The app DEPLOYS to iOS 18 but must COMPILE against the iOS 26 SDK:
      # voice input references the SpeechAnalyzer/SpeechTranscriber family
      # (DictationEngines.swift), which older SDKs simply don't declare —
      # `@available(iOS 26)` guards the runtime, not the compile. Xcode 16.x
      # therefore fails with "cannot find type 'SpeechTranscriber'", which is
      # what broke every run while this job still pinned Xcode 16.4 on
      # macos-15. The app ships built with Xcode 27, so the newest 27.x on the
      # image is picked, else the newest 26.x (a fallback the code should
      # still compile under), else the image's default Xcode.app if GitHub
      # rotates the versioned paths.
      #
      # The simulator is the iPhone 18 Pro when the chosen Xcode has one (the
      # Xcode 27 image's runtimes do; it had no 17 Pro), else its last
      # iPhone: another Xcode's runtimes may not carry that name.
      - name: Select Xcode
        run: |
          echo "Xcodes on the image:"
          ls -d /Applications/Xcode*
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XCODE:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version
          echo "Available iPhone simulators:"
          iphones=$(xcrun simctl list devices available |
            sed -nE 's/^ +(iPhone.*[^ ]) \([0-9A-F-]{36}\).*/\1/p')
          echo "$iphones"
          SIMULATOR="iPhone 18 Pro"
          grep -qxF "$SIMULATOR" <<< "$iphones" || SIMULATOR=$(tail -1 <<< "$iphones")
          echo "Testing on: $SIMULATOR"
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"

      # tmux for the host the session flows reach (below).
      - name: Install xcodegen and tmux
        run: brew install xcodegen tmux

      # Which cargo profile the "Build Rust" phase builds for each
      # configuration, and that the app links that one: no Rust is built.
      - name: Rust profile per configuration
        run: scripts/rust/test-build-ios.sh

      # The app's "Build Rust" phase (scripts/rust/build-ios.sh) runs cargo
      # through rustup: from ~/.cargo/bin where rustup.rs puts it, else the
      # rustup on PATH (the macOS image's comes from its package manager and
      # keeps nothing in ~/.cargo/bin; the step's PATH reaches the phase
      # through xcodebuild). Install
      # the pinned toolchain and the simulator's Rust target up front, so
      # the Xcode build log is not where a download shows up. An image
      # without rustup gets it from rustup.rs first.
      - name: Install the Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustup target add aarch64-apple-ios-sim
          rustc --version

      # The "Build Rust" phase compiles crates/ffi and its graph (NSH among
      # it) for the simulator into target/: kept between runs, keyed on what
      # decides it.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ios-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-ios-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      # Cache the resolved SwiftPM checkouts keyed on Package.resolved. On a hit
      # the resolve step below is essentially a no-op; on a miss it repopulates
      # the cache. The key uses the committed Package.resolved (WhisperKit by
      # version) so it only busts when a dependency actually changes.
      - name: Cache SwiftPM packages
        uses: actions/cache@v6
        with:
          path: ${{ env.SPM_CACHE_DIR }}
          key: spm-${{ runner.os }}-${{ hashFiles('Moshpit.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve SwiftPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Moshpit.xcodeproj \
            -scheme Moshpit \
            -clonedSourcePackagesDirPath "$SPM_CACHE_DIR"

      # Run the unit + UI test targets (MoshpitTests and MoshpitUITests, both
      # wired into the shared "Moshpit" scheme's test action in project.yml).
      #
      # CODE_SIGNING_ALLOWED=NO: project.yml sets CODE_SIGN_IDENTITY
      # "Apple Development" / CODE_SIGN_STYLE Automatic and expects a
      # DEVELOPMENT_TEAM from Signing.xcconfig. Signing.xcconfig IS committed to
      # this repo (with an empty DEVELOPMENT_TEAM), so `xcodegen generate` never
      # fails for lack of it — but a simulator Debug build needs no signing at
      # all, so we disable it here. If project.yml ever forced signing in a way
      # that broke the *simulator* destination, that would be fixed in
      # project.yml (out of scope for this workflow); as configured today the
      # simulator build+test works with no Signing.xcconfig secret present.
      # A host for the UI flows that need a live session
      # (NSHSessionFlowUITest): sshd on loopback as devbox.example.com and
      # tmux on a private socket, staged by the screenshot run's script with
      # a key made for this job. Its seeds reach the UI test runner as
      # TEST_RUNNER_MOSHPIT_SEED_* (xcodebuild strips the prefix); the key
      # is masked in the log all the same. When staging fails the flow
      # skips and every other test still runs.
      - name: Stage a host for the session flows
        continue-on-error: true
        run: |
          scripts/shots/stage-host.sh start "$RUNNER_TEMP/stage-host" > "$RUNNER_TEMP/seed.env"
          while IFS= read -r line; do
            name=${line%%=*}; value=${line#*=}
            [ "$name" = MOSHPIT_SEED_KEY_B64 ] && echo "::add-mask::$value"
            echo "TEST_RUNNER_$name=$value" >> "$GITHUB_ENV"
          done < "$RUNNER_TEMP/seed.env"
          cut -d= -f1 "$RUNNER_TEMP/seed.env"

      - name: Build & test
        run: |
          xcodebuild test \
            -project Moshpit.xcodeproj \
            -scheme Moshpit \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_DIR" \
            CODE_SIGNING_ALLOWED=NO

      - name: Take the staged host down
        if: always()
        run: scripts/shots/stage-host.sh stop "$RUNNER_TEMP/stage-host"
