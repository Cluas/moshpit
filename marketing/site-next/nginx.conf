# Serving the Astro build.
#
# The config this replaces carried a 20-line `map` that rewrote every pretty URL
# back onto a flat filename (/docs/herdr → /docs-herdr.html), plus a
# `try_files … /assets/$uri` fallback so pages could reference /moshpit.css
# without knowing which of three ConfigMaps it landed in. Astro emits the
# directory shape the URLs already implied, so both of those are gone: the only
# rule left is "add .html".
#
# URLs are unchanged from the old site — /docs/herdr, /pricing, /zh/docs/herdr
# all still resolve, which is what the App Store support URL depends on.
# The pre-rebrand host. It served this site for two days under the old name and
# is in the README, the App Store draft and whatever anyone bookmarked, so it
# redirects per-path rather than dying or landing everyone on the homepage.
#
# Done here rather than with an ingress annotation on purpose: ingress-nginx
# disables configuration-snippet annotations by default, and the one annotation
# that is allowed (permanent-redirect) drops the path. Keeping it in this file
# also means the rule is versioned with the site it redirects to.
server {
    listen 80;
    server_name offhook.cluas.eu.org;
    return 301 https://moshpit.cluas.eu.org$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit Location headers as paths, not absolute URLs. TLS terminates at the
    # ingress controller, so this nginx only ever sees plain HTTP and would
    # build every redirect below as http://moshpit.cluas.eu.org/… — sending a
    # reader who followed an https link back out over http, to be redirected
    # again. A relative Location keeps whatever scheme the reader arrived on.
    absolute_redirect off;

    # Every URL that has ever pointed at this site and no longer names a file,
    # redirected to the one that does. Two generations of them:
    #
    # The old site's flat filenames (docs-herdr.html). The pretty paths were
    # always the canonical form, but the files were reachable for months.
    rewrite ^/docs-([a-z0-9-]+)\.zh\.html$   /zh/docs/$1   permanent;
    rewrite ^/docs-([a-z0-9-]+)\.html$       /docs/$1      permanent;
    rewrite ^/guide-([a-z0-9-]+)\.zh\.html$  /zh/guide/$1  permanent;
    rewrite ^/guide-([a-z0-9-]+)\.html$      /guide/$1     permanent;
    rewrite ^/docs\.zh\.html$                /zh/docs      permanent;
    rewrite ^/(compare|pricing|guides)\.zh\.html$ /zh/$1    permanent;

    # Root-level names, which were real files under `build.format: 'file'` and
    # are directories now.
    rewrite ^/index\.html$                   /             permanent;
    rewrite ^/(zh|docs|compare|pricing|guides|privacy|support)\.html$ /$1 permanent;

    # And the extension-bearing docs URLs that the 'file' build published for
    # about forty minutes, canonical tag included. Cleaning up after ourselves
    # costs four lines and saves a duplicate-content report later.
    rewrite ^/zh/docs/([a-z0-9-]+)\.html$    /zh/docs/$1   permanent;
    rewrite ^/docs/([a-z0-9-]+)\.html$       /docs/$1      permanent;
    rewrite ^/zh/guide/([a-z0-9-]+)\.html$   /zh/guide/$1  permanent;
    rewrite ^/guide/([a-z0-9-]+)\.html$      /guide/$1     permanent;

    # Old asset URLs. The pages never used them — they referenced /moshpit.css
    # and nginx fell back to /assets/ — but the fallback made both spellings
    # work, so keep the one that no longer exists pointing at the one that does.
    rewrite ^/assets/(.*)$ /$1 permanent;

    # Everything is prose plus a ~100KB Pagefind index that is mostly repeated
    # English and Chinese sentences. Uncompressed, the index alone took seconds
    # and search sat on "loading" long enough to read as broken. text/html is
    # excluded because nginx always compresses it and listing it warns.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json
               image/svg+xml application/xml application/wasm;

    # Astro fingerprints everything under /_astro/, so those are the only files
    # here safe to cache hard — the name changes whenever the bytes do.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pagefind's index is regenerated on every build and keeps its filenames,
    # so it gets the same short cache as the images rather than an immutable one.
    location /pagefind/ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        # `$uri.html` is the whole trick: /docs/herdr → /docs/herdr.html, which
        # is exactly what `build.format: 'file'` writes. $uri/index.html covers
        # the one directory index Astro still emits.
        try_files $uri $uri.html $uri/index.html =404;

        # A stale landing page hides every page added after it, which is a
        # mistake this site has already made once.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;
}
