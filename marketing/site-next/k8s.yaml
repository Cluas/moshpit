# Moshpit marketing site — nginx serving the Astro build from an image.
#
#   scripts/deploy-site.sh     # builds, gates, pushes, applies this, rolls out
#
# The history is worth keeping because it explains two things in here that look
# like they could be simplified. The site first shipped as three ConfigMaps
# (pages, assets, nginx.conf) and outgrew them: a ConfigMap caps at 1MiB and the
# screenshots blew past it. It then shipped as a flat-HTML image, and now as an
# Astro build in the same image.
#
# DNS (one-time, in the cluas.eu.org zone):
#   moshpit.cluas.eu.org → CNAME moshi.cluas.eu.org  (or the same 4 A records)
# cert-manager then completes the TLS order on its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moshpit-site
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels: { app: moshpit-site }
  template:
    metadata:
      labels: { app: moshpit-site }
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        # The site is baked into this image. There are deliberately no volume
        # mounts: the ConfigMaps this used to run on mounted at exactly
        # /usr/share/nginx/html and /usr/share/nginx/html/assets, so leaving
        # them in place would shadow every file in the image and the switch
        # would silently be a no-op — new image, old content, no error.
        # scripts/deploy-site.sh replaces the tag below on each deploy.
        #
        # imagePullPolicy stays IfNotPresent because the tag is unique per
        # deploy; :latest moves too, but nothing schedules on it.
        - name: nginx
          image: ghcr.io/cluas/moshpit-site:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: moshpit-site
  namespace: default
spec:
  selector: { app: moshpit-site }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moshpit-site
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: moshpit.cluas.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moshpit-site
                port: { number: 80 }
  tls:
    - hosts: [moshpit.cluas.eu.org]
      secretName: moshpit-site-tls
