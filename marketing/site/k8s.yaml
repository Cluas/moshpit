# Moshpit marketing site — same shape as moshi-site (nginx + ConfigMap),
# but the page source now lives in the repo (marketing/site/) instead of
# only inside the cluster.
#
# Deploy / update:
#   kubectl create configmap moshpit-site \
#     $(for f in marketing/site/*.html; do printf -- "--from-file=%s " "$f"; done) \
#     --dry-run=client -o yaml | kubectl apply --server-side -f -
#   kubectl create configmap moshpit-assets --from-file=marketing/site/assets/ \
#     --dry-run=client -o yaml | kubectl apply --server-side -f -
#   kubectl create configmap moshpit-nginx \
#     --from-file=default.conf=marketing/site/nginx.conf \
#     --dry-run=client -o yaml | kubectl apply --server-side -f -
#
# Three ConfigMaps, not one: a ConfigMap caps at 1MiB and the docs pages plus
# the screenshots blew past it. nginx.conf makes the split invisible to the
# pages — they still reference assets flat, and nginx falls back to assets/.
# `--server-side` is also required: the binary screenshots exceed the 256KiB
# last-applied annotation that a client-side apply writes.
#   kubectl apply -f marketing/site/k8s.yaml
#   kubectl rollout restart deploy/moshpit-site   # pick up ConfigMap changes
#
# DNS (one-time, in the cluas.eu.org zone):
#   moshpit.cluas.eu.org → CNAME moshi.cluas.eu.org  (or the same 4 A records)
# cert-manager then completes the TLS order on its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moshpit-site
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels: { app: moshpit-site }
  template:
    metadata:
      labels: { app: moshpit-site }
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        # The site is baked into this image. There are deliberately no volume
        # mounts: the ConfigMaps this used to run on mounted at exactly
        # /usr/share/nginx/html and /usr/share/nginx/html/assets, so leaving
        # them in place would shadow every file in the image and the switch
        # would silently be a no-op — new image, old content, no error.
        # scripts/deploy-site.sh replaces the tag below on each deploy.
        - name: nginx
          image: ghcr.io/cluas/moshpit-site:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: moshpit-site
  namespace: default
spec:
  selector: { app: moshpit-site }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moshpit-site
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: moshpit.cluas.eu.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moshpit-site
                port: { number: 80 }
  tls:
    - hosts: [moshpit.cluas.eu.org]
      secretName: moshpit-site-tls
