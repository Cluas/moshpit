# Two things this config buys, both of which the flat-file layout costs us:
#
# 1. Clean URLs. Pages are stored as docs-herdr.html but served at /docs/herdr —
#    a docs site whose links end in .html reads like a folder someone zipped.
#    The map below rewrites the pretty path back onto the real file, so the
#    files stay previewable as plain files (open one in a browser, it works)
#    while the URLs look like a product.
#
# 2. Fresh HTML. The site outgrew one ConfigMap, so pages and assets are
#    separate mounts; `try_files … /assets/$uri` hides that from the pages,
#    which reference assets at the root (/offhook.css). Rooted, not relative:
#    at /docs/herdr a relative href resolves against /docs/ and 404s, which
#    once shipped every docs page with no stylesheet at all. And HTML is
#    served no-cache, because the alternative is shipping a docs update that
#    half the readers cannot see — which is exactly what happened.
map $uri $prettyfile {
    default                       "";
    ~^/docs/?$                    /docs.html;
    ~^/guides/?$                  /guides.html;
    ~^/compare/?$                 /compare.html;
    ~^/privacy/?$                 /privacy.html;
    ~^/support/?$                 /support.html;
    ~^/docs/(?<p>[a-z0-9-]+)/?$   /docs-$p.html;
    ~^/guide/(?<g>[a-z0-9-]+)/?$  /guide-$g.html;

    # Chinese lives under /zh/… and maps onto the .zh.html files.
    ~^/zh/?$                        /zh.html;
    ~^/zh/docs/?$                   /docs.zh.html;
    ~^/zh/guides/?$                 /guides.zh.html;
    ~^/zh/compare/?$                /compare.zh.html;
    ~^/zh/docs/(?<zp>[a-z0-9-]+)/?$ /docs-$zp.zh.html;
    ~^/zh/guide/(?<zg>[a-z0-9-]+)/?$ /guide-$zg.zh.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything here is prose — HTML, CSS, and a ~100KB search index that is
    # mostly repeated English and Chinese sentences. Uncompressed, the index
    # alone took seconds on a normal connection and search sat on "loading"
    # long enough to read as broken. gzip_types excludes text/html because
    # nginx always compresses that one and listing it warns.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json
               image/svg+xml application/xml;

    # HTML must not be cached: a stale landing page hides every page added
    # after it. Assets are content-addressed by name and can be cached.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        # Pretty path first, then the literal file, then the assets mount.
        try_files $prettyfile $uri $uri/ /assets/$uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
    }
}
