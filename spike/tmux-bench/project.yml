# G2's device criterion (docs/nsh/DESIGN.md, the gate table): parse CPU of
# the app's TmuxControlClient with the Swift and the Rust parser, on the
# iPhone. A separate app — com.cluas.moshpit.tmuxbench, never the shipping
# bundle id — built from the app's own parser sources and the same Rust
# library (crates/ffi, built by the app's scripts/rust/build-ios.sh). Generate
# with `xcodegen generate`; build, install and run with scripts/device.sh.
name: MoshpitTmuxBench
options:
  bundleIdPrefix: com.cluas
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
# DEVELOPMENT_TEAM comes from the app's Signing.xcconfig, as the app's does
# (project.yml), never from here.
configFiles:
  Debug: ../../Signing.xcconfig
  Release: ../../Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MoshpitTmuxBench:
    type: application
    platform: iOS
    sources:
      - path: Bench
      # The parser exactly as the app compiles it.
      - path: ../../Moshpit/Services/Tmux/TmuxControlClient.swift
      - path: ../../Moshpit/Services/Tmux/TmuxRustParser.swift
      - path: ../../crates/tmux/tests/fixtures/captures
        type: folder
        buildPhase: resources
      - path: ../../crates/tmux/tests/fixtures/synthetic
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Build Rust
        script: |
          "$SRCROOT/../../scripts/rust/build-ios.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cluas.moshpit.tmuxbench
        PRODUCT_NAME: MoshpitTmuxBench
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The app's link of the Rust library, as in the root project.yml —
        # always the shipping `app` profile, whatever the configuration: the
        # bench measures the parser the App Store build runs.
        SWIFT_INCLUDE_PATHS: $(inherited) $(SRCROOT)/../../crates/ffi/include
        MOSHPIT_RUST_PROFILE: app
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/../../target/$(MOSHPIT_RUST_TARGET)/$(MOSHPIT_RUST_PROFILE)
        OTHER_LDFLAGS: $(inherited) -lmoshpit_ffi
        "MOSHPIT_RUST_TARGET[sdk=iphoneos*][arch=arm64]": aarch64-apple-ios
        "MOSHPIT_RUST_TARGET[sdk=iphonesimulator*][arch=arm64]": aarch64-apple-ios-sim
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: Bench/Info.plist
      properties:
        CFBundleDisplayName: tmux bench
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # The iOS 27 SDK's apps exit at launch without a scene manifest
        # (spike/ios/project.yml).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
