<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Beacon app icon master — FULL-BLEED square (iOS applies its own mask).
       Mark: terminal speech bubble — もしもし "hello?" × shell prompt. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202835"/>
      <stop offset="0.55" stop-color="#131922"/>
      <stop offset="1" stop-color="#0b0f15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#5ad8c5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5ad8c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8df5e6"/>
      <stop offset="0.55" stop-color="#5ad8c5"/>
      <stop offset="1" stop-color="#2aa896"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" fill="url(#bg)"/>
  <rect width="240" height="240" fill="url(#glow)"/>

  <!-- terminal speech bubble -->
  <path d="M78 68 h84 a20 20 0 0 1 20 20 v48 a20 20 0 0 1 -20 20 h-54 l-28 28 v-28
           a20 20 0 0 1 -22 -20 v-48 a20 20 0 0 1 20 -20 z"
        fill="none" stroke="url(#teal)" stroke-width="12" stroke-linejoin="round"/>

  <!-- prompt: block cursor + command line -->
  <rect x="93" y="98" width="17" height="32" rx="3.5" fill="url(#teal)"/>
  <rect x="121" y="121" width="40" height="9" rx="4.5" fill="#ffffff4a"/>
</svg>
